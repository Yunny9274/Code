[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geco-cf"
version = "0.1.0"
description = "Community-guided counterfactual explanations for graph neural networks"
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.2",
  "numpy>=1.24",
]

[project.optional-dependencies]
pyg = ["torch>=2.1", "torch-geometric>=2.5"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
